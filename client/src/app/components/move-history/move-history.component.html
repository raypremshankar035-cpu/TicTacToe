<div class="move-history">
  <h3>Move History</h3>
 
  @if (moves().length === 0) {
    <p class="empty">No moves yet.</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Move</th>
          <th>Player</th>
          <th>Position</th>
        </tr>
      </thead>
      <tbody>
        @for (move of moves(); track move.moveNumber) {
          <tr>
            <td>{{ move.moveNumber }}</td>
            <td>{{ move.player }}</td>
            <td>Row {{ move.row + 1 }}, Column {{ move.column + 1 }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
